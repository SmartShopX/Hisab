<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Rounded Squircle with safe-zone -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#grad)" filter="url(#shadow)" />
  
  <!-- Subtle inner glow rim -->
  <rect x="36" y="36" width="440" height="440" rx="104" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Modern SmartShopX Core Icon (Store Roof + Shopping Bag + Lightning Bolt) -->
  <g transform="translate(116, 106) scale(0.55)" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Store Awning Roof -->
    <path d="M50 140 L256 30 L462 140 L50 140 Z" fill="#ffffff" fill-opacity="0.15" />
    <path d="M50 140 L50 200 C50 220 70 240 100 240 C130 240 150 220 150 200 C150 220 170 240 200 240 C230 240 250 220 250 200 C250 220 270 240 300 240 C330 240 350 220 350 200 C350 220 370 240 400 240 C430 240 450 220 450 200 L450 140" />
    
    <!-- Modern Shopping Cart / Bag base -->
    <rect x="90" y="240" width="332" height="230" rx="24" fill="#ffffff" fill-opacity="0.1" />
    <line x1="90" y1="310" x2="422" y2="310" stroke-dasharray="16 12" />
    
    <!-- Dynamic Lightning Flash Accent -->
    <polygon points="270,180 210,310 260,310 230,420 330,270 270,270" fill="#facc15" stroke="#facc15" stroke-width="8" stroke-linejoin="round" />
  </g>

  <!-- Brand Text Accent -->
  <text x="256" y="422" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="2">SMART <tspan fill="#34d399">HISAB</tspan></text>
</svg>
