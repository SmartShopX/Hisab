    <script>
      // Gracefully handle Vite development HMR in iframe/proxy environments where port 24678 is unreachable
      (function() {
        // 1. Mock WebSocket for vite-hmr to prevent connection failures to unmapped ports
        try {
          const NativeWebSocket = window.WebSocket;
          if (NativeWebSocket) {
            function MockHmrWebSocket(url, protocols) {
              const isViteHmr =
                (typeof protocols === 'string' && protocols.includes('vite-hmr')) ||
                (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
                (typeof url === 'string' && (url.includes('24678') || url.includes('token=')));

              if (isViteHmr) {
                const emitter = new EventTarget();
                const self = {
                  CONNECTING: 0,
                  OPEN: 1,
                  CLOSING: 2,
                  CLOSED: 3,
                  readyState: 1,
                  protocol: 'vite-hmr',
                  url: String(url),
                  bufferedAmount: 0,
                  extensions: '',
                  binaryType: 'blob',
                  send: function() {},
                  close: function() {
                    self.readyState = 3;
                  },
                  addEventListener: function(type, listener, options) {
                    emitter.addEventListener(type, listener, options);
                  },
                  removeEventListener: function(type, listener, options) {
                    emitter.removeEventListener(type, listener, options);
                  },
                  dispatchEvent: function(event) {
                    return emitter.dispatchEvent(event);
                  },
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null,
                };
                queueMicrotask(() => {
                  const ev = new Event('open');
                  self.dispatchEvent(ev);
                  if (typeof self.onopen === 'function') self.onopen(ev);
                });
                return self;
              }
              return new NativeWebSocket(url, protocols);
            }
            MockHmrWebSocket.prototype = NativeWebSocket.prototype;
            MockHmrWebSocket.CONNECTING = 0;
            MockHmrWebSocket.OPEN = 1;
            MockHmrWebSocket.CLOSING = 2;
            MockHmrWebSocket.CLOSED = 3;
            window.WebSocket = MockHmrWebSocket;
          }
        } catch (_) {}

        // 2. Suppress benign Vite connection warnings in development
        try {
          const _origConsoleError = console.error;
          console.error = function(...args) {
            const hasViteIssue = args.some(arg =>
              typeof arg === 'string' &&
              (arg.includes('[vite]') || arg.includes('vite-hmr') || arg.includes('failed to connect to websocket'))
            );
            if (hasViteIssue) {
              console.debug(...args);
              return;
            }
            _origConsoleError.apply(console, args);
          };

          window.addEventListener('unhandledrejection', function(event) {
            const reason = event && event.reason;
            const msg = (reason && (reason.message || reason.stack || String(reason))) || '';
            if (msg.includes('[vite]') || msg.includes('WebSocket closed without opened') || msg.includes('vite-hmr')) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);
        } catch (_) {}
      })();
    </script>
